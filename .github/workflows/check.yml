name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Google TV app
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Build and test Android app
        run: tools/check.sh android

      - name: Build APK using the TV location
        run: ./build.sh --generic

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Android-Arabic
          path: FreeMyTV.apk
          if-no-files-found: error
          retention-days: 30

  web:
    name: Translations, LG and Samsung
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Check translations and web apps
        run: tools/check.sh web
